    <style>
:root {
  color-scheme: dark;
  --ink: #f7efe5;
  --ink-soft: #b9ada1;
  --paper: #090908;
  --paper-soft: #11100f;
  --card: #191715;
  --card-soft: #211d1a;
  --line: #3e342d;
  --line-soft: #2c2723;
  --gold: #c5a065;
  --gold-deep: #d7b77f;
  --gold-soft: #3b2e25;
  --brown: #2b1d18;
  --orange: #d98b5b;
  --success: #79a88d;
  --danger: #e17d72;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.34);
  --shadow-soft: 0 7px 20px rgba(0, 0, 0, 0.22);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: auto;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family:
    -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Noto Sans TC",
    "Microsoft JhengHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

.ambient {
  position: fixed;
  z-index: -1;
  width: 48vw;
  height: 48vw;
  border-radius: 50%;
  background: rgba(180, 139, 66, 0.08);
  filter: blur(4px);
  pointer-events: none;
}

.ambient-one {
  top: -20vw;
  left: -20vw;
}

.ambient-two {
  right: -24vw;
  bottom: 3vh;
  background: rgba(83, 60, 46, 0.06);
}

.app-shell {
  width: min(100%, 760px);
  min-height: 100vh;
  margin: 0 auto;
  background: var(--paper);
  box-shadow: 0 0 80px rgba(49, 40, 32, 0.08);
}

.ui-icon {
  display: inline-block;
  width: 21px;
  height: 21px;
  flex: none;
}

#view {
  min-height: 100vh;
  padding-bottom: calc(104px + var(--safe-bottom));
  outline: none;
}

.bottom-nav {
  position: fixed;
  z-index: 50;
  right: 0;
  bottom: 0;
  left: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  width: min(100%, 760px);
  height: calc(76px + var(--safe-bottom));
  margin: 0 auto;
  padding: 8px 6px calc(8px + var(--safe-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 -8px 28px rgba(36, 30, 25, 0.08);
  backdrop-filter: blur(18px);
}

.nav-item {
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  border-radius: 16px;
  background: transparent;
  color: #8d8983;
  font-size: 10px;
  font-weight: 700;
}

.nav-item .ui-icon {
  width: 23px;
  height: 23px;
}

.nav-item.active {
  color: var(--ink);
}

.nav-item.active::before {
  position: absolute;
  width: 27px;
  height: 3px;
  margin-top: -55px;
  border-radius: 3px;
  background: var(--ink);
  content: "";
}

.hero {
  position: relative;
  min-height: 480px;
  overflow: hidden;
  background: var(--ink);
}

.hero > img {
  width: 100%;
  height: 480px;
  object-fit: cover;
}

.hero-shade,
.day-cover-shade {
  position: absolute;
  inset: 0;
  background: rgba(14, 12, 10, 0.43);
}

.hero-content {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-start;
  flex-direction: column;
  justify-content: flex-end;
  padding: 42px 24px 145px;
  color: #fff;
}

.eyebrow,
.section-kicker {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--gold-deep);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.hero .eyebrow {
  color: #eadbc2;
}

.hero h1 {
  margin: 8px 0 12px;
  font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
  font-size: clamp(43px, 10vw, 72px);
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.035em;
}

.hero h1 em {
  color: #d9b46d;
  font-size: 0.75em;
  font-style: normal;
  letter-spacing: 0.04em;
}

.hero p {
  max-width: 410px;
  margin: 0;
  color: rgba(255, 255, 255, 0.84);
  font-size: 14px;
  line-height: 1.6;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}

.hero-meta span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 999px;
  background: rgba(16, 14, 12, 0.28);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  backdrop-filter: blur(9px);
}

.hero-meta .ui-icon {
  width: 15px;
  height: 15px;
}

.countdown-pill {
  position: absolute;
  top: 20px;
  right: 22px;
  padding: 9px 13px;
  border-radius: 999px;
  background: #fff;
  color: var(--ink);
  box-shadow: var(--shadow);
  font-size: 11px;
  font-weight: 800;
}

.section-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 0 14px 28px;
}

.overlap-section {
  position: relative;
  z-index: 2;
  margin-top: -98px;
}

.card,
.mini-card,
.hotel-card,
.reorder-tip,
.budget-card,
.expense-summary article,
.photo-stats,
.category-summary,
.tax-progress-list {
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--shadow-soft);
}

.card {
  border-radius: 26px;
  padding: 20px;
}

.card-heading,
.section-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.card-heading h2,
.section-title-row h2 {
  margin: 5px 0 0;
  font-size: 22px;
  letter-spacing: -0.03em;
}

.small-pill,
.text-button {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: transparent;
  color: var(--ink-soft);
  font-size: 11px;
  font-weight: 700;
}

.small-pill {
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #f8f6f2;
}

.text-button .ui-icon {
  width: 15px;
  height: 15px;
}

.flight-card {
  border-top: 4px solid var(--gold);
}

.flight-route {
  display: grid;
  grid-template-columns: 1fr minmax(80px, 0.7fr) 1fr;
  align-items: center;
  gap: 10px;
  padding: 27px 4px 20px;
}

.flight-route > div:first-child,
.flight-route > div:last-child {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.flight-route strong {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 30px;
}

.flight-route span {
  color: var(--ink-soft);
  font-size: 11px;
}

.flight-route b {
  margin-top: 11px;
  font-size: 18px;
}

.flight-line {
  display: flex;
  align-items: center;
  color: var(--gold-deep);
}

.flight-line span {
  display: block;
  width: 100%;
  height: 1px;
  background: var(--line);
}

.flight-line .ui-icon {
  width: 19px;
  height: 19px;
  margin: 0 6px;
  transform: rotate(10deg);
}

.text-right {
  text-align: right;
}

.date-chip {
  padding: 9px 12px;
  border-radius: 12px;
  background: #f6f3ed;
  color: var(--ink-soft);
  text-align: center;
  font-size: 11px;
  font-weight: 700;
}

.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.mini-card {
  display: flex;
  width: 100%;
  min-height: 133px;
  flex-direction: column;
  padding: 16px;
  border-radius: 22px;
  text-align: left;
}

.mini-card > span {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 750;
}

.mini-card > span .ui-icon {
  width: 16px;
  height: 16px;
}

.mini-card > strong {
  margin-top: auto;
  font-size: 32px;
  letter-spacing: -0.04em;
}

.mini-card b {
  font-size: 16px;
}

.mini-card small {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 10px;
}

.weather-card {
  color: var(--ink);
  transition:
    transform 0.18s ease,
    border-color 0.18s ease;
}

.weather-card:active {
  transform: scale(0.98);
}

.weather-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.rate-card {
  color: var(--ink);
  transition:
    transform 0.18s ease,
    border-color 0.18s ease;
}

.rate-card:active {
  transform: scale(0.98);
}

.rate-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.today-card {
  padding-bottom: 13px;
}

.day-summary-list {
  display: grid;
  gap: 9px;
  margin-top: 18px;
}

.day-summary {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 12px;
  align-items: center;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--card-soft);
}

.day-summary > span {
  display: grid;
  min-height: 48px;
  place-items: center;
  border-radius: 13px;
  background: var(--gold);
  color: #090908;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 0.04em;
}

.day-summary div {
  display: grid;
  gap: 4px;
  min-width: 0;
}

.day-summary strong {
  font-size: 13px;

}

}

}

  color: #fff;
}

.day-tabs button.active span {
  color: rgba(255, 255, 255, 0.7);
}

.day-cover {
  position: relative;
  height: 240px;
  overflow: hidden;
  margin: 0 14px;
  border-radius: 26px;
  background: var(--ink);
  box-shadow: var(--shadow);
  color: #fff;
}

.day-cover img {
  position: absolute;
  z-index: 1;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.day-cover-slide {
  opacity: 0;
  transform: scale(1.015);
  transition:
    opacity 0.9s ease,
    transform 5.8s ease;
}

.day-cover-slide.active {
  opacity: 1;
  transform: scale(1);
}

  position: absolute;
  z-index: 0;
  inset: 0;
  display: grid;
  place-items: center;
  background:

}

  height: 36px;
}

      rgba(9, 9, 8, 0.08) 22%,
      rgba(9, 9, 8, 0.3) 58%,
      rgba(9, 9, 8, 0.9) 100%

  pointer-events: none;
}

  right: 0;
  bottom: 0;
  left: 0;
  display: block;
  min-height: 118px;
  padding: 22px 23px 24px;
  color: #fff8ef;
  pointer-events: none;

}

}

}

.reference-card-header > div {
  min-width: 0;
}

.reference-card-index {
  flex: none;
  color: var(--gold-deep);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.reference-card-header h2 {
  margin: 5px 0 0;
  font-size: 18px;
  line-height: 1.35;
}

.reference-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.reference-tags span {
  padding: 5px 8px;
  border-radius: 999px;
  background: var(--gold-soft);
  color: var(--gold-deep);
  font-size: 8px;
  font-weight: 800;
}

.reference-embed-shell {
  position: relative;
  display: flex;
  min-height: 520px;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  background:
    radial-gradient(circle at 50% 28%, rgba(197, 160, 101, 0.16), transparent 38%),
    #0d0c0b;
}

.reference-embed-placeholder {
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 30px;
  color: var(--ink-soft);
  text-align: center;
}

.reference-embed-placeholder .ui-icon {
  color: var(--gold-deep);
  font-size: 42px;
}

.reference-embed-placeholder strong {
  color: var(--ink);
  font-size: 12px;
}

.reference-embed-placeholder span {
  max-width: 230px;
  font-size: 9px;
  line-height: 1.5;
}

.reference-embed-shell .instagram-media {
  width: 100% !important;
  min-width: 0 !important;
  max-width: 540px !important;
  margin: 0 auto !important;
  border: 0 !important;
  border-radius: 0 !important;
}

.reference-card-footer {
  display: grid;
  gap: 12px;
  padding: 15px 17px 17px;
}

.reference-card-footer p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 10px;
  line-height: 1.6;
}

.reference-open-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 45px;
  border: 1px solid rgba(197, 160, 101, 0.34);
  border-radius: 14px;
  background: #f7efe5;
  color: #241b16;
  font-size: 10px;
  font-weight: 850;
}

.reference-open-button .ui-icon {
  font-size: 18px;
}

@media (max-width: 390px) {
  .reference-embed-shell {
    min-height: 500px;
  }
}

.floating-add {
  position: fixed;
  z-index: 42;
  right: max(18px, calc((100vw - 720px) / 2));
  bottom: calc(87px + var(--safe-bottom));
  display: flex;
  align-items: center;
  gap: 7px;
  min-height: 48px;
  padding: 12px 17px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  box-shadow: 0 10px 26px rgba(23, 21, 18, 0.25);
  font-size: 11px;
  font-weight: 800;
}

.floating-add .ui-icon {
  width: 17px;
}

.photo-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin: 0 14px 14px;
  padding: 15px 6px;
  border-radius: 22px;
}

.photo-stats > div {
  display: flex;
  align-items: center;
  flex-direction: column;
  justify-content: center;
  min-height: 58px;
  border-right: 1px solid var(--line-soft);
}

.photo-stats > div:last-child {
  border-right: 0;
}

.photo-stats strong {
  font-size: 18px;
}

.photo-stats span {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 8px;
}

.progress-ring {
  position: relative;
}

.progress-ring::before {
  position: absolute;
  width: 43px;
  height: 43px;
  border: 4px solid #e9e5de;
  border-top-color: var(--gold);
  border-radius: 50%;
  content: "";
  transform: rotate(var(--progress));
}

.progress-ring strong,
.progress-ring span {
  position: relative;
}

.photo-grid {
  display: grid;
  gap: 14px;
  padding: 0 14px 20px;
}

.photo-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: #fff;
  box-shadow: var(--shadow-soft);
}

.photo-card.completed {
  border-color: rgba(60, 109, 85, 0.45);
}

.photo-image {
  position: relative;
  height: 205px;
  overflow: hidden;
  background: #ddd7cc;
}

.photo-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-image > span,
.completed-badge {
  position: absolute;
  top: 13px;
  left: 13px;
  padding: 7px 9px;
  border-radius: 999px;
  background: rgba(20, 18, 15, 0.78);
  color: #fff;
  font-size: 9px;
  font-weight: 800;
  backdrop-filter: blur(7px);
}

.completed-badge {
  right: 13px;
  left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(44, 88, 66, 0.9);
}

.completed-badge .ui-icon {
  width: 13px;
  height: 13px;
}

.photo-copy {
  padding: 16px;
}

.photo-copy > small {
  color: var(--gold-deep);
  font-size: 9px;
  font-weight: 750;
}

.photo-copy h2 {
  margin: 5px 0 7px;
  font-size: 19px;
  letter-spacing: -0.02em;
}

.photo-copy p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.6;
}

.photo-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 14px;
}

.photo-actions a,
.photo-actions button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 41px;
  border-radius: 12px;
  background: var(--ink);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
}

.photo-actions button {
  background: #f1eee8;
  color: var(--ink);
}

.photo-card.completed .photo-actions button {
  background: #e8f0eb;
  color: var(--success);
}

.photo-actions .ui-icon {
  width: 15px;
  height: 15px;
}

.modal-open {
  overflow: hidden;
}

.modal-backdrop {
  position: fixed;
  z-index: 100;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-top: 30px;
  background: rgba(18, 16, 14, 0.5);
  backdrop-filter: blur(5px);
}

.modal-sheet {
  position: relative;
  width: min(100%, 760px);
  max-height: 91vh;
  overflow-y: auto;
  padding: 28px 18px calc(24px + var(--safe-bottom));
  border-radius: 29px 29px 0 0;
  background: #faf8f4;
  box-shadow: 0 -14px 40px rgba(18, 16, 14, 0.18);
  animation: slide-up 0.24s ease-out both;
}

@keyframes slide-up {
  from {
    opacity: 0;
    transform: translateY(28px);
  }
}

.sheet-handle {
  position: absolute;
  top: 9px;
  left: 50%;
  width: 42px;
  height: 4px;
  border-radius: 4px;
  background: #d0cbc3;
  transform: translateX(-50%);
}

.modal-close {
  position: absolute;
  z-index: 2;
  top: 22px;
  right: 16px;
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border-radius: 50%;
  background: #eeebe5;
}

.modal-close .ui-icon {
  width: 17px;
  height: 17px;
}

.modal-header {
  padding-right: 45px;
}

.modal-header h2 {
  margin: 5px 0 6px;
  font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
  font-size: 29px;
}

.modal-header p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 11px;
  line-height: 1.55;
}

.currency-converter {
  display: grid;
  gap: 14px;
  margin-top: 22px;
}

.currency-field {
  display: grid;
  gap: 8px;
}

.currency-field > span {
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 750;
}

.currency-input-wrap {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  min-height: 58px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--card);
}

.currency-input-wrap > span {
  color: var(--gold-deep);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
}

.currency-input-wrap input {
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 26px;
  font-weight: 800;
}

.currency-input-wrap small {
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 750;
}

.currency-result {
  display: grid;
  gap: 8px;
  padding: 20px;
  border: 1px solid rgba(197, 160, 101, 0.35);
  border-radius: 20px;
  background: var(--brown);
}

.currency-result span {
  color: rgba(247, 239, 229, 0.7);
  font-size: 10px;
  font-weight: 750;
}

.currency-result strong {
  color: var(--ink);
  font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
  font-size: clamp(32px, 9vw, 45px);
  letter-spacing: -0.03em;
}

.currency-rate-note {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--ink-soft);
  font-size: 10px;
  line-height: 1.5;
}

.currency-rate-note .ui-icon {
  width: 16px;
  height: 16px;
  color: var(--gold-deep);
}

.form-stack {
  display: grid;
  gap: 13px;
  margin-top: 22px;
}

.form-stack label {
  display: grid;
  gap: 7px;
}

.form-stack label > span:first-child {
  color: var(--ink-soft);
  font-size: 10px;
  font-weight: 750;
}

.form-stack input,
.form-stack select,
.form-stack textarea {
  width: 100%;
  min-height: 47px;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  outline: none;
  background: #fff;
  font-size: 12px;
}

.form-stack textarea {
  min-height: 90px;
  resize: vertical;
}

.form-stack input:focus,
.form-stack select:focus,
.form-stack textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(179, 138, 66, 0.12);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.amount-grid {
  grid-template-columns: 0.85fr 1.15fr;
}

.check-label {
  display: flex !important;
  align-items: flex-start;
  grid-template-columns: 21px 1fr;
  gap: 10px !important;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
}

.check-label input {
  width: 19px;
  height: 19px;
  min-height: 0;
  margin: 2px 0 0;
  accent-color: var(--gold-deep);
}

.check-label > span {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.check-label strong {
  color: var(--ink);
  font-size: 11px;
}

.check-label small {
  color: var(--ink-soft);
  font-size: 9px;
  line-height: 1.45;
}

.modal-actions {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 9px;
  margin-top: 3px;
}

.danger-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 49px;
  padding: 12px 14px;
  border: 1px solid #ebc8c2;
  border-radius: 14px;
  background: #fff3f1;
  color: var(--danger);
  font-size: 10px;
  font-weight: 800;
}

.danger-button .ui-icon {
  width: 16px;
  height: 16px;
}

.guide-hero {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 20px;
  padding: 17px;
  border-radius: 19px;
  background: var(--brown);
  color: #fff;
}

.guide-hero > span {
  display: grid;
  width: 50px;
  height: 50px;
  place-items: center;
  border-radius: 16px;
  background: #d2ae69;
  color: var(--brown);
}

.guide-hero strong {
  font-family: Georgia, "Times New Roman", "Noto Serif TC", serif;
  font-size: 18px;
  line-height: 1.4;
}

.guide-steps {
  display: grid;
  gap: 0;
  margin: 20px 0;
  padding: 0;
  list-style: none;
}

.guide-steps li {
  display: grid;
  grid-template-columns: 35px 1fr;
  gap: 12px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--line);
}

.guide-steps li > span {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border-radius: 50%;
  background: #eee5d5;
  color: var(--gold-deep);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 13px;
  font-weight: 700;
}

.guide-steps strong {
  font-size: 12px;
}

.guide-steps p {
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 10px;
  line-height: 1.55;
}

.guide-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
  padding: 12px;
  border-radius: 13px;
  background: #fff1e9;
  color: #8d3a1c;
  font-size: 10px;
  line-height: 1.5;
}

.guide-note .ui-icon {
  width: 16px;
  height: 16px;
}

.link-action {
  width: 100%;
}

.settings-list {
  display: grid;
  margin-top: 20px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: #fff;
}

.settings-list article {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 76px;
  padding: 13px;
  border-bottom: 1px solid var(--line-soft);
}

.settings-list article:last-child {
  border-bottom: 0;
}

.settings-list article > div {
  display: flex;
  align-items: center;
  gap: 11px;
}

.settings-list article > div > .ui-icon {
  width: 19px;
  color: var(--gold-deep);
}

.settings-list article span {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.settings-list strong {
  font-size: 11px;
}

.settings-list small {
  color: var(--ink-soft);
  font-size: 9px;
}

.settings-list button {
  padding: 8px 10px;
  border-radius: 10px;
  background: #f1eee8;
  font-size: 9px;
  font-weight: 800;
}

.settings-danger {
  margin-top: 20px;
  text-align: center;
}

.settings-danger button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px;
  background: transparent;
  color: var(--danger);
  font-size: 10px;
  font-weight: 800;
}

.settings-danger .ui-icon {
  width: 15px;
}

.credits-list {
  display: grid;
  gap: 8px;
  margin-top: 20px;
}

.credits-list a {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fff;
}

.credits-list strong {
  font-size: 11px;
}

.credits-list span {
  color: var(--ink-soft);
  font-size: 9px;
}

.toast {
  position: fixed;
  z-index: 200;
  top: 82px;
  left: 50%;
  max-width: calc(100% - 34px);
  padding: 11px 15px;
  border-radius: 999px;
  background: rgba(23, 21, 18, 0.94);
  color: #fff;
  box-shadow: var(--shadow);
  font-size: 11px;
  font-weight: 750;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -10px);
  transition:
    opacity 0.18s ease,
    transform 0.18s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* LuxTravel × STARLUX inspired black-and-champagne theme */
.ambient {
  background: rgba(197, 160, 101, 0.07);
}

.ambient-two {
  background: rgba(77, 51, 39, 0.14);
}

.app-shell {
  background: var(--paper);
  box-shadow: 0 0 80px rgba(0, 0, 0, 0.48);
}

.nav-item.active {
  color: var(--gold-deep);
}

.small-pill,
.timeline-content,
.item-actions button,
.category-grid > div,
.tax-progress-list > article,
.filter-row button,
.photo-card,
.modal-close,
.form-stack input,
.form-stack select,
.form-stack textarea,
.check-label,
.guide-steps li,
.settings-list,
.credits-list {
  border-color: var(--line);
  background: var(--card);
  color: var(--ink);
}

.bottom-nav {
  border-color: rgba(197, 160, 101, 0.24);
  background: rgba(17, 16, 15, 0.96);
  box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.38);
}

.nav-item {
  color: #8f847b;
}

.nav-item.active::before {
  background: var(--gold);
}

.hero > img,
.day-cover img,
.photo-image img {
  filter: saturate(0.8) contrast(0.96) sepia(0.06);
}

.hero-content,
.day-cover-copy {
  color: var(--ink);
}

.hero .eyebrow,
.hero h1 em {
  color: var(--gold-deep);
}

.hero p,
.day-cover-title {
  color: rgba(247, 239, 229, 0.78);
}

.hero-meta span,
.countdown-pill {
  border-color: rgba(197, 160, 101, 0.38);
  background: rgba(9, 9, 8, 0.5);
  color: var(--ink);
}

.card,
.mini-card,
.hotel-card,
.reorder-tip,
.budget-card,
.expense-summary article,
.photo-stats,
.category-summary,
.tax-progress-list {
  border-color: var(--line);
  background: var(--card);
  color: var(--ink);
  box-shadow: var(--shadow-soft);
}

.date-chip,
.type-tag,
.item-note,
.expense-icon,
.guide-note {
  background: var(--gold-soft);
  color: var(--gold-deep);
}

.expense-summary article:first-child,
.guide-hero {
  background: var(--brown);
  color: var(--ink);
}

.expense-summary article:first-child span,
.expense-summary article:first-child small {
  color: rgba(247, 239, 229, 0.7);
}

.progress-track span {
  background: var(--gold);
}

.tax-alert,
.tax-progress-list {
  border-color: rgba(197, 160, 101, 0.5);
  background: rgba(59, 46, 37, 0.72);
}

.tax-icon,
.tax-progress-list article > span {
  background: var(--gold);
  color: var(--paper);
}

.day-tabs button,
.filter-row button {
  border-color: var(--line);
  background: var(--card);
  color: var(--ink);
}

.day-tabs button.active,
.filter-row button.active,
.primary-action,
.floating-add {
  border-color: var(--gold);
  background: var(--gold);
  color: var(--paper);
}

.reorder-tip,
.budget-card,
.category-summary,
.tax-progress-list,
.photo-stats {
  background: var(--card-soft);
}

.timeline-card,
.expense-item {
  border-color: var(--line);
}

.timeline-rail > span {
  border-color: var(--paper);
  background: var(--gold);
}

.timeline-rail:not(.last) > span::after,
.progress-track {
  background: var(--line-soft);
}

.map-button,
.text-button,
.link-action,
.settings-list button {
  color: var(--gold-deep);
}

.expense-summary article:first-child strong,
.expense-summary article:first-child b,
.guide-hero strong {
  color: var(--ink);
}

.expense-icon {
  border: 1px solid rgba(197, 160, 101, 0.28);
}

.photo-card.completed {
  border-color: rgba(121, 168, 141, 0.5);
  background: rgba(38, 67, 52, 0.4);
}

.photo-actions a,
.photo-actions button {
  border-color: var(--line);
  background: var(--card-soft);
  color: var(--ink);
}

.photo-actions button {
  background: var(--gold-soft);
  color: var(--gold-deep);
}

.modal-backdrop {
  background: rgba(0, 0, 0, 0.72);
}

.modal-sheet {
  background: var(--paper-soft);
  box-shadow: 0 -14px 40px rgba(0, 0, 0, 0.48);
}

.sheet-handle {
  background: var(--line);
}

.form-stack input:focus,
.form-stack select:focus,
.form-stack textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(197, 160, 101, 0.14);
}

.danger-button,
.settings-danger button {
  border-color: rgba(225, 125, 114, 0.45);
  background: rgba(95, 37, 33, 0.4);
  color: #f0a59d;
}

.toast {
  border: 1px solid rgba(197, 160, 101, 0.32);
  background: rgba(25, 23, 21, 0.96);
  color: var(--ink);
}

/* Iconify size calibration */
.ui-icon {
  width: 1em;
  height: 1em;
  font-size: 22px;
  vertical-align: middle;
}

.nav-item .ui-icon {
  font-size: 26px;
}

.section-kicker .ui-icon,
.mini-card > span .ui-icon,
.text-button .ui-icon {
  font-size: 18px;
}

.flight-line .ui-icon {
  font-size: 21px;
}

.hotel-card > .ui-icon,
.settings-list article > div > .ui-icon {
  font-size: 21px;
}

.hotel-card span .ui-icon,
.tax-alert button .ui-icon,
.time-range .ui-icon,
.item-note .ui-icon {
  font-size: 17px;
}

.tax-icon .ui-icon,
.guide-hero .ui-icon {
  font-size: 25px;
}

.reorder-tip > .ui-icon {
  font-size: 21px;
}

.item-actions .ui-icon,
.expense-item > button .ui-icon,
.completed-badge .ui-icon {
  font-size: 17px;
}

.map-button .ui-icon,
.photo-actions .ui-icon,
.currency-rate-note .ui-icon,
.danger-button .ui-icon,
.guide-note .ui-icon,
.settings-danger .ui-icon {
  font-size: 18px;
}

.primary-action .ui-icon,
.floating-add .ui-icon {
  font-size: 20px;
}

.expense-icon .ui-icon {
  font-size: 22px;
}

.empty-state > .ui-icon {
  font-size: 38px;
}

.modal-close .ui-icon {
  font-size: 21px;
}

@media (min-width: 700px) {
  .app-shell {
    border-right: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }

  .hero {
    min-height: 560px;
  }

  .hero > img {
    height: 560px;
  }

  .hero-content {
    padding: 55px 42px 170px;
  }

  .overlap-section {
    margin-top: -108px;
  }

  .section-stack,
  .timeline-list,
  .photo-grid,
  .expense-list {
    padding-right: 24px;
    padding-left: 24px;
  }

  .day-cover,
  .reorder-tip,
  .budget-card,
  .expense-summary,
  .category-summary,
  .tax-progress-list,
  .photo-stats {
    margin-right: 24px;
    margin-left: 24px;
  }

  .day-tabs,
  .filter-row {
    padding-right: 24px;
    padding-left: 24px;
  }

  .photo-grid {
    grid-template-columns: 1fr 1fr;
  }

  .photo-image {
    height: 185px;
  }

  .modal-sheet {
    margin-bottom: 12px;
    border-radius: 29px;
  }
}

@media (max-width: 370px) {
  .hero h1 {
    font-size: 39px;
  }

  .flight-route {
    grid-template-columns: 1fr 72px 1fr;
  }

  .flight-route strong {
    font-size: 27px;
  }

  .card {
    padding: 17px;
  }

  .hotel-card {
    grid-template-columns: 64px 1fr 20px;
    gap: 9px;
    padding: 13px;
  }

  .hotel-thumb {
    width: 62px;
    height: 62px;
    border-radius: 14px;
  }

  .page-header h1 {
    font-size: 34px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved) return clone(DEFAULT_STATE);
    return {
      ...clone(DEFAULT_STATE),
      ...saved,
      settings: { ...clone(DEFAULT_STATE.settings), ...(saved.settings || {}) },
      itinerary: [],
      expenses: Array.isArray(saved.expenses) ? saved.expenses : [],
      completedSpots: saved.completedSpots || {}
    };
  } catch {
    return clone(DEFAULT_STATE);
  }
}

function saveState() {
  const { itinerary, ...deviceState } = state;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(deviceState));
}

function icon(name, className = "") {
  return `<iconify-icon class="ui-icon ${className}" icon="${ICONS[name] || ICONS.info}" aria-hidden="true"></iconify-icon>`;
}

function hydrateIcons(root = document) {
  root.querySelectorAll("[data-icon]").forEach((slot) => {
    slot.innerHTML = icon(slot.dataset.icon);
  });
}

function escapeHtml(value = "") {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatTwd(value) {
  return `NT$ ${Math.round(Number(value) || 0).toLocaleString("zh-TW")}`;
}

function formatJpy(value) {
  return `¥ ${Math.round(Number(value) || 0).toLocaleString("ja-JP")}`;
}

function formatJpyPerTwd(value) {
  const rate = Number(value);
  return rate > 0
    ? (1 / rate).toLocaleString("ja-JP", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })
    : "--";
}

function toTwd(expense) {
  if (expense.currency === "TWD") return Number(expense.amount) || 0;
  return (Number(expense.amount) || 0) * state.settings.jpyToTwd;
}

function toJpy(expense) {
  if (expense.currency === "JPY") return Number(expense.amount) || 0;
  return (Number(expense.amount) || 0) / state.settings.jpyToTwd;
}

function formatTripDate(dateString) {
  return new Intl.DateTimeFormat("zh-TW", {
    month: "numeric",
    day: "numeric",
    weekday: "short",
    timeZone: "Asia/Tokyo"
  }).format(new Date(`${dateString}T12:00:00+09:00`));
}

function shortTripDate(dateString) {
  return dateString.slice(5).replace("-", "/");
}

function mapUrl(query) {
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(query)}`;
}

function safeHttpUrl(value) {
  try {
    const parsed = new URL(String(value || ""));
    return parsed.protocol === "https:" || parsed.protocol === "http:" ? parsed.href : "";
  } catch {
    return "";
  }
}

function dateInTaipei() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());
  const lookup = Object.fromEntries(parts.map((part) => [part.type, part.value]));
  return `${lookup.year}-${lookup.month}-${lookup.day}`;
}

function tripStatus() {
  const today = dateInTaipei();
  if (today < TRIP_START) {
    const diff = Math.ceil(
      (new Date(`${TRIP_START}T00:00:00+08:00`) - new Date(`${today}T00:00:00+08:00`)) /
        86400000
    );
    return { label: `距離出發 ${diff} 天`, activeDay: 1, phase: "before" };
  }
  if (today > TRIP_END) return { label: "旅行回憶模式", activeDay: 5, phase: "after" };
  const day =
    Math.floor(
      (new Date(`${today}T00:00:00+08:00`) - new Date(`${TRIP_START}T00:00:00+08:00`)) /
        86400000
    ) + 1;
  return { label: `DAY ${day} · 旅行進行中`, activeDay: day, phase: "during" };
}

function isSupabaseItineraryConfigured() {
  return (
    SUPABASE_ITINERARY.url.startsWith("https://") &&
    !SUPABASE_ITINERARY.url.includes("YOUR_PROJECT_REF") &&
    SUPABASE_ITINERARY.apiKey &&
    !SUPABASE_ITINERARY.apiKey.includes("YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY") &&
    SUPABASE_ITINERARY.table &&
    SUPABASE_ITINERARY.daysTable
  );
}

function isSupabaseReferencesConfigured() {
  return (
    SUPABASE_ITINERARY.url.startsWith("https://") &&
    SUPABASE_ITINERARY.apiKey &&
    SUPABASE_ITINERARY.referencesTable
  );
}

function resolveItineraryImage(imagePath) {
  if (!imagePath) return "";
  if (/^https?:\/\//i.test(imagePath)) return imagePath;
  const encodedPath = String(imagePath)
    .split("/")
    .map((segment) => encodeURIComponent(segment))
    .join("/");
  return `${SUPABASE_ITINERARY.url}/storage/v1/object/public/${encodeURIComponent(
    SUPABASE_ITINERARY.imageBucket
  )}/${encodedPath}`;
}

function normalizeItineraryRows(dayRows, itemRows) {
  const timeLabels = {
    opening: "營業時間",
    recommended: "建議時段",
    fixed: "固定時間",
    deadline: "期限／建議",
    reservation: "預約班次"
  };
  const itemsByDate = new Map();

  itemRows.forEach((row) => {
    const tripDate = String(row.trip_date || "");
    if (!tripDate) return;
    if (!itemsByDate.has(tripDate)) itemsByDate.set(tripDate, []);

    const title = row.title || "未命名景點";
    itemsByDate.get(tripDate).push({
      id: row.id,
      sortOrder: Number.isFinite(Number(row.sort_order))
        ? Number(row.sort_order)
        : Number.MAX_SAFE_INTEGER,
      title,
      type: row.category || "行程",
      subtitle: row.subtitle || "",
      timeType: row.time_type,
      timeLabel: timeLabels[row.time_type] || "適合時段",
      timeText: row.time_text || "",
      note: row.note || "",
      query: row.map_query || title,
      image: resolveItineraryImage(row.image_path),
      imageAlt: row.image_alt || `${title}的旅行照片`,
      hoursSource: row.hours_source_url || "",
      isOptional: Boolean(row.is_optional)
    });
  });

  return dayRows
    .filter((row) => row.trip_date)
    .map((row, index) => {
      const date = String(row.trip_date);
      const dayCity = String(row.day_city ?? row.dayCity ?? "").trim();
      const dayTitle = String(row.day_title ?? row.dayTitle ?? "").trim();
      const items = [...(itemsByDate.get(date) || [])].sort(
        (a, b) => a.sortOrder - b.sortOrder
      );
      return {
        day: Number(row.day_number) || index + 1,
        date,
        city: dayCity,
        title: dayTitle,
        images: items
          .filter((item) => item.image)
          .map((item) => ({ src: item.image, alt: item.imageAlt })),
        items
      };
    })
    .sort((a, b) => a.day - b.day);
}

async function loadItinerary() {
  if (!isSupabaseItineraryConfigured()) {
    itineraryStatus = "config";
    itineraryError = "請先在 HTML 內填入 Supabase Project URL 與 publishable key（或舊版 anon key）。";
    if (state.view === "itinerary") render();
    return;
  }

  itineraryStatus = "loading";
  itineraryError = "";
  itineraryDaySummariesByDate = new Map();
  if (state.view === "itinerary") render();

  try {
    const itemEndpoint = new URL(
      `/rest/v1/${SUPABASE_ITINERARY.table}`,
      `${SUPABASE_ITINERARY.url}/`
    );
    itemEndpoint.searchParams.set("select", "*");
    itemEndpoint.searchParams.set("is_active", "eq.true");
    itemEndpoint.searchParams.set("order", "trip_date.asc,sort_order.asc");

    const dayEndpoint = new URL(
      `/rest/v1/${SUPABASE_ITINERARY.daysTable}`,
      `${SUPABASE_ITINERARY.url}/`
    );
    dayEndpoint.searchParams.set(
      "select",
      "day_number,trip_date,day_city,day_title,is_active"
    );
    dayEndpoint.searchParams.set("is_active", "eq.true");
    dayEndpoint.searchParams.set("order", "day_number.asc,trip_date.asc");

    const requestOptions = {
      cache: "no-store",
      headers: {
        apikey: SUPABASE_ITINERARY.apiKey,
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    };
    const [dayResponse, itemResponse] = await Promise.all([
      fetch(dayEndpoint, requestOptions),
      fetch(itemEndpoint, requestOptions)
    ]);
    if (!dayResponse.ok) throw new Error(`Supabase days ${dayResponse.status}`);
    if (!itemResponse.ok) throw new Error(`Supabase itinerary ${itemResponse.status}`);

    const [dayRows, itemRows] = await Promise.all([
      dayResponse.json(),
      itemResponse.json()
    ]);
    const normalizedDayRows = Array.isArray(dayRows) ? dayRows : [];
    itineraryDaySummariesByDate = new Map(
      normalizedDayRows
        .filter((row) => row.trip_date)
        .map((row) => [
          String(row.trip_date),
          {
            city: String(row.day_city ?? "").trim(),
            title: String(row.day_title ?? "").trim()
          }
        ])
    );
    state.itinerary = normalizeItineraryRows(
      normalizedDayRows,
      Array.isArray(itemRows) ? itemRows : []
    );
    if (!state.itinerary.some((day) => day.day === state.activeDay)) {
      state.activeDay = state.itinerary[0]?.day || 1;
    }
    itineraryStatus = state.itinerary.length ? "ready" : "empty";
  } catch (error) {
    itineraryStatus = "error";
    itineraryError =
      "目前無法讀取旅行散策資料，請檢查 Days、Itinerary 資料表名稱、RLS 與 API 設定。";
    console.error("Itinerary load failed", error);
  }

  if (state.view === "itinerary") render();
}

function normalizeInstagramPermalink(value) {
  try {
    const url = new URL(String(value || "").trim());
    const hostname = url.hostname.toLowerCase().replace(/^www\./, "");
    if (hostname !== "instagram.com") return "";

    const match = url.pathname.match(/^\/(reel|p|tv)\/([a-z0-9_-]+)/i);
    if (!match) return "";
    return `https://www.instagram.com/${match[1].toLowerCase()}/${match[2]}/`;
  } catch {
    return "";
  }
}

function normalizeReferenceFilmRows(rows) {
  return rows
    .map((row, index) => {
      const reelUrl = normalizeInstagramPermalink(row.reel_url);
      if (!reelUrl) return null;
      return {
        id: row.id,
        reelUrl,
        title: String(row.title || `旅行靈感 #${index + 1}`).trim(),
        category: String(row.category || "").trim(),
        destination: String(row.destination || "").trim(),
        note: String(row.note || "").trim(),
        sortOrder: Number.isFinite(Number(row.sort_order))
          ? Number(row.sort_order)
          : Number.MAX_SAFE_INTEGER
      };
    })
    .filter(Boolean)
    .sort((a, b) => a.sortOrder - b.sortOrder);
}

async function loadReferenceFilms() {
  if (!isSupabaseReferencesConfigured()) {
    referencesStatus = "config";
    referencesError = "尚未設定 References_film 資料表。";
    if (state.view === "references") render();
    return;
  }

  referencesStatus = "loading";
  referencesError = "";
  if (state.view === "references") render();

  try {
    const endpoint = new URL(
      `/rest/v1/${SUPABASE_ITINERARY.referencesTable}`,
      `${SUPABASE_ITINERARY.url}/`
    );
    endpoint.searchParams.set(
      "select",
      "id,reel_url,title,category,destination,note,sort_order,is_active,created_at"
    );
    endpoint.searchParams.set("is_active", "eq.true");
    endpoint.searchParams.set("order", "sort_order.asc.nullslast,created_at.asc");

    const response = await fetch(endpoint, {
      cache: "no-store",
      headers: {
        apikey: SUPABASE_ITINERARY.apiKey,
        "Cache-Control": "no-cache",
        Pragma: "no-cache"
      }
    });
    if (!response.ok) throw new Error(`Supabase references ${response.status}`);

    const rows = await response.json();
    referenceFilms = normalizeReferenceFilmRows(Array.isArray(rows) ? rows : []);
    referencesStatus = referenceFilms.length ? "ready" : "empty";
  } catch (error) {
    referenceFilms = [];
    referencesStatus = "error";
    referencesError =
      "目前無法讀取行前參考資料，請先執行 References_film SQL 並確認 RLS 設定。";
    console.error("Reference films load failed", error);
  }

  if (state.view === "references") render();
}

function ensureInstagramEmbedScript() {
  if (window.instgrm?.Embeds) return Promise.resolve(true);
  if (instagramEmbedScriptPromise) return instagramEmbedScriptPromise;

  instagramEmbedScriptPromise = new Promise((resolve) => {
    const existing = document.getElementById("instagram-embed-script");
    if (existing) {
      existing.addEventListener("load", () => resolve(true), { once: true });
      existing.addEventListener("error", () => resolve(false), { once: true });
      window.setTimeout(() => resolve(Boolean(window.instgrm?.Embeds)), 4500);
      return;
    }

    const script = document.createElement("script");
    script.id = "instagram-embed-script";
    script.async = true;
    script.src = "https://www.instagram.com/embed.js";
    script.onload = () => resolve(true);
    script.onerror = () => resolve(false);
    document.body.appendChild(script);
  });
  return instagramEmbedScriptPromise;
}

function mountInstagramEmbed(shell) {
  if (!shell || shell.dataset.embedLoaded === "true") return;
  const reelUrl = normalizeInstagramPermalink(shell.dataset.reelUrl);
  if (!reelUrl) return;

  shell.dataset.embedLoaded = "true";
  shell.innerHTML = `
    <blockquote
      class="instagram-media"
      data-instgrm-permalink="${escapeHtml(reelUrl)}"
      data-instgrm-version="14"
    ></blockquote>
  `;
  ensureInstagramEmbedScript().then((loaded) => {
    if (!loaded || state.view !== "references") return;
    window.requestAnimationFrame(() => window.instgrm?.Embeds?.process());
  });
}

function stopReferenceFilmObserver() {
  referenceEmbedObserver?.disconnect();
  referenceEmbedObserver = undefined;
}

function initReferenceFilmEmbeds(root) {
  stopReferenceFilmObserver();
  const shells = [...root.querySelectorAll("[data-reference-embed]")];
  if (!shells.length) return;

  if (!("IntersectionObserver" in window)) {
    shells.forEach(mountInstagramEmbed);
    return;
  }

  referenceEmbedObserver = new IntersectionObserver(
    (entries, observer) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        mountInstagramEmbed(entry.target);
        observer.unobserve(entry.target);
      });
    },
    { rootMargin: "900px 0px" }
  );
  shells.forEach((shell) => referenceEmbedObserver.observe(shell));
}

function render() {
  stopDayCoverCarousel();
  stopReferenceFilmObserver();
  document.body.dataset.view = state.view;
  document.querySelectorAll(".nav-item").forEach((button) => {
    button.classList.toggle("active", button.dataset.view === state.view);
  });

  const view = document.getElementById("view");
  if (state.view === "home") view.innerHTML = renderHome();
  if (state.view === "itinerary") view.innerHTML = renderItinerary();
  if (state.view === "references") view.innerHTML = renderReferences();
  if (state.view === "expenses") view.innerHTML = renderExpenses();
  if (state.view === "photos") view.innerHTML = renderPhotos();
  if (state.view === "home") {
    const heroImage = view.querySelector(".hero > img");
    if (heroImage) {
      heroImage.src = "guide/KYOTO202611.jpg";
      heroImage.alt = "楓の京阪宇神旅行主視覺";
    }
  }
  hydrateIcons(view);
  if (state.view === "itinerary") {
    keepActiveDayTabVisible(view);
    startDayCoverCarousel(view);
  }
  if (state.view === "references") initReferenceFilmEmbeds(view);
}

function stopDayCoverCarousel() {
  window.clearInterval(dayCoverTimer);
  dayCoverTimer = undefined;
}

function startDayCoverCarousel(root) {
  const getSlides = () => [...root.querySelectorAll("[data-day-cover-slide]")];
  if (getSlides().length <= 1) return;

  dayCoverTimer = window.setInterval(() => {
    if (document.hidden) return;
    const slides = getSlides();
    if (slides.length <= 1) {
      stopDayCoverCarousel();
      return;
    }
    const currentIndex = slides.findIndex((slide) => slide.classList.contains("active"));
    const nextIndex = currentIndex < 0 ? 0 : (currentIndex + 1) % slides.length;
    slides.forEach((slide, index) => slide.classList.toggle("active", index === nextIndex));
  }, 5000);
}

function keepActiveDayTabVisible(root) {
  const tabs = root.querySelector(".day-tabs");
  const activeTab = tabs?.querySelector("button.active");
  if (!tabs || !activeTab) return;

  window.requestAnimationFrame(() => {
    const tabsRect = tabs.getBoundingClientRect();
    const activeRect = activeTab.getBoundingClientRect();
    const centeredLeft =
      tabs.scrollLeft +
      (activeRect.left - tabsRect.left) -
      (tabs.clientWidth - activeRect.width) / 2;
    tabs.scrollLeft = Math.max(0, centeredLeft);
  });
}

function expenseTotals() {
  const totalTwd = state.expenses.reduce((sum, expense) => sum + toTwd(expense), 0);
  const categoryTotals = state.expenses.reduce((result, expense) => {
    result[expense.category] = (result[expense.category] || 0) + toTwd(expense);
    return result;
  }, {});
  const estimatedRefundJpy = state.expenses
    .filter((expense) => expense.taxFree)
    .reduce((sum, expense) => sum + toJpy(expense) * (10 / 110), 0);
  return { totalTwd, categoryTotals, estimatedRefundJpy };
}

function taxFreeProgress() {
  const groups = {};
  state.expenses
    .filter((expense) => expense.category === "購物" && expense.taxFree && expense.store)
    .forEach((expense) => {
      const key = `${expense.date}|${expense.store.trim().toLowerCase()}`;
      if (!groups[key]) groups[key] = { date: expense.date, store: expense.store, total: 0 };
      groups[key].total += toJpy(expense);
    });
  return Object.values(groups).filter((group) => group.total < 5000);
}

  const input = document.getElementById("currencyJpyInput");
  const result = document.getElementById("currencyTwdResult");
  const rateNote = document.getElementById("currencyRateNote");
  if (!input || !result || !rateNote) return;

  const rawValue = input.value.trim();
  result.textContent = rawValue
    ? formatTwd(Math.max(0, Number(rawValue) || 0) * state.settings.jpyToTwd)
    : "—";
  rateNote.innerHTML = `${icon("trend")} 1 JPY ≈ NT$ ${state.settings.jpyToTwd.toFixed(
    4
  )} · ${escapeHtml(state.settings.rateUpdated)}`;
}

function deleteExpense(id) {
  if (!window.confirm("確定刪除這筆消費紀錄嗎？")) return;
  state.expenses = state.expenses.filter((expense) => expense.id !== id);
  saveState();
  render();
  showToast("消費紀錄已刪除");
}

function exportData() {
  const payload = {
    exportedAt: new Date().toISOString(),
    app: "京阪家族旅行 2026",
    version: 2,
    data: {
      expenses: state.expenses,
      completedSpots: state.completedSpots,
      settings: state.settings
    }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = `京阪家族旅行備份-${dateInTaipei()}.json`;
  anchor.click();
  URL.revokeObjectURL(url);
  showToast("裝置資料已匯出");
}

async function importData(file) {
  try {
    const payload = JSON.parse(await file.text());
    if (!payload?.data || typeof payload.data !== "object") throw new Error("invalid");
    if (!window.confirm("匯入會覆蓋這台裝置目前的記帳、拍照進度與設定，確定繼續嗎？")) return;
    state.expenses = Array.isArray(payload.data.expenses) ? payload.data.expenses : [];
    state.completedSpots = payload.data.completedSpots || {};
    state.settings = { ...state.settings, ...(payload.data.settings || {}) };
    saveState();
    closeModal();
    render();
    showToast("裝置資料已匯入");
  } catch {
    showToast("這個檔案不是有效的旅行備份");
  }
}

async function refreshRate(showFeedback = true) {
  try {
    const response = await fetch("https://open.er-api.com/v6/latest/JPY", { cache: "no-store" });
    if (!response.ok) throw new Error("rate");
    const data = await response.json();
    if (!data?.rates?.TWD) throw new Error("rate");
    state.settings.jpyToTwd = Number(data.rates.TWD);
    state.settings.rateUpdated = new Intl.DateTimeFormat("zh-TW", {
      month: "numeric",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(new Date());
    saveState();
    if (state.view === "home") render();
    updateCurrencyConverter();
    if (showFeedback) {
      closeModal();
      showToast("匯率已更新");
    }
  } catch {
    if (showFeedback) showToast("暫時無法取得即時匯率，已保留目前數值");
  }
}

function getDevicePosition() {
  return new Promise((resolve, reject) => {
    if (typeof navigator === "undefined" || !navigator.geolocation) {
      reject(new Error("geolocation-unavailable"));
      return;
    }
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: false,
      timeout: 9000,
      maximumAge: 5 * 60 * 1000
    });
  });
}

function isTaiwanLocation(latitude, longitude) {
  const mainIslandAndPenghu =
    latitude >= 21.8 && latitude <= 25.6 && longitude >= 119.2 && longitude <= 122.2;
  const kinmen =
    latitude >= 24.3 && latitude <= 24.6 && longitude >= 118.1 && longitude <= 118.6;
  const matsu =
    latitude >= 25.85 && latitude <= 26.4 && longitude >= 119.8 && longitude <= 120.6;
  return mainIslandAndPenghu || kinmen || matsu;
}

async function resolveWeatherPlace(showFeedback) {
  const kyoto = { city: "京都", latitude: 35.0116, longitude: 135.7681 };
  try {
    const position = await getDevicePosition();
    const { latitude, longitude } = position.coords;
    if (isTaiwanLocation(latitude, longitude)) {
      if (showFeedback) showToast("目前位於台灣，改顯示京都天氣");
      return kyoto;
    }
    if (showFeedback) showToast("已讀取目前位置的即時天氣");
    return { city: "所在地", latitude, longitude };
  } catch {
    if (showFeedback) showToast("無法取得定位，改顯示京都天氣");
    return kyoto;
  }
}

async function refreshWeather(showFeedback = false) {
  const requestId = ++weatherRequestId;
  weather = {
    status: "loading",
    city: weather.city || "京都",
    temperature: "--",
    label: "正在取得位置"
  };
  if (state.view === "home") render();

  const place = await resolveWeatherPlace(showFeedback);
  if (requestId !== weatherRequestId) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,weather_code&timezone=auto`;
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error("weather");
    const data = await response.json();
    if (requestId !== weatherRequestId) return;
    const labels = {
      0: "晴朗",
      1: "大致晴朗",
      2: "局部多雲",
      3: "陰天",
      45: "有霧",
      48: "霧淞",
      51: "毛毛雨",
      53: "毛毛雨",
      55: "毛毛雨",
      61: "小雨",
      63: "有雨",
      65: "大雨",
      71: "小雪",
      73: "有雪",
      75: "大雪",
      80: "陣雨",
      81: "陣雨",
      82: "強陣雨",
      95: "雷雨"
    };
    weather = {
      status: "ready",
      city: place.city,
      temperature: Math.round(data.current.temperature_2m),
      label: labels[data.current.weather_code] || "天氣變化"
    };
  } catch {
    weather = { status: "error", city: place.city, temperature: "--", label: "離線模式" };
  }
  if (state.view === "home") render();
}

document.addEventListener("click", (event) => {
  const target = event.target.closest("button, [data-view], [data-action], [data-day], [data-photo-filter], [data-expense-filter]");
  if (!target) return;
  if (target.dataset.action === "open-itinerary-note" && event.target.closest("a")) return;

  if (target.dataset.view) {
    state.view = target.dataset.view;
    saveState();
    render();
    return;
  }

  if (target.dataset.day) {
    state.activeDay = Number(target.dataset.day);
    saveState();
    render();
    return;
  }

  if (target.dataset.photoFilter) {
    state.photoFilter = target.dataset.photoFilter;
    saveState();
    render();
    return;
  }

  if (target.dataset.expenseFilter) {
    state.expenseFilter = target.dataset.expenseFilter;
    saveState();
    render();
    return;
  }

  const action = target.dataset.action;
  if (!action) return;
  if (action === "close-modal" && event.target !== target && target.classList.contains("modal-backdrop")) return;

  const actions = {
    "go-home": () => {
      state.view = "home";
      saveState();
      render();
    },
    "open-settings": openSettings,
    "open-itinerary-note": () =>
      openItineraryNote(target.dataset.itineraryDay, target.dataset.itineraryIndex),
    "open-currency-converter": openCurrencyConverter,
    "refresh-weather-location": () => refreshWeather(true),
    "close-modal": closeModal,
    "toggle-flight": () => {
      state.flightIndex = state.flightIndex === 0 ? 1 : 0;
      saveState();
      render();
    },
    "show-tax-guide": openTaxGuide,
    "add-expense": openExpenseForm,
    "delete-expense": () => deleteExpense(target.dataset.id),
    "toggle-photo": () => {
      state.completedSpots[target.dataset.id] = !state.completedSpots[target.dataset.id];
      saveState();
      render();
    },
    "edit-budget": () => {
      const value = window.prompt("請輸入家庭旅費預算（台幣）", String(state.settings.budgetTwd));
      if (!value || Number(value) <= 0) return;
      state.settings.budgetTwd = Number(value);
      saveState();
      render();
    },
    "refresh-rate": () => refreshRate(true),
    "export-data": exportData,
    "import-data": () => document.getElementById("importFile").click(),
    "show-credits": openCredits,
    "reset-data": () => {
      if (!window.confirm("確定要清除這台裝置的記帳、拍照進度與設定嗎？旅行散策資料不會受影響。")) return;
      state = clone(DEFAULT_STATE);
      saveState();
      closeModal();
      render();
      loadItinerary();
      showToast("已清除裝置資料");
    }
  };
  actions[action]?.();
});

document.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);

  if (form.id === "expenseForm") {
    state.expenses.push({
      id: `expense-${Date.now()}`,
      title: String(data.get("title")).trim(),
      currency: String(data.get("currency")),
      amount: Number(data.get("amount")),
      category: String(data.get("category")),
      payment: String(data.get("payment")),
      date: String(data.get("date")),
      store: String(data.get("store")).trim(),
      taxFree: data.get("taxFree") === "on"
    });
    saveState();
    closeModal();
    render();
    showToast("消費已記下");
  }
});

document.addEventListener("input", (event) => {
  if (event.target.id === "currencyJpyInput") updateCurrencyConverter();
});

document.getElementById("importFile").addEventListener("change", (event) => {
  const [file] = event.target.files;
  if (file) importData(file);
  event.target.value = "";
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && document.body.classList.contains("modal-open")) closeModal();
  const itineraryCard = event.target.closest?.('[data-action="open-itinerary-note"]');
  if (
    itineraryCard &&
    !event.target.closest("a, button") &&
    (event.key === "Enter" || event.key === " ")
  ) {
    event.preventDefault();
    itineraryCard.click();
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    refreshRate(false);
    refreshWeather(false);
  }
});

document.documentElement.dataset.buildVersion = BUILD_VERSION;
hydrateIcons();
render();
loadItinerary();
loadReferenceFilms();
refreshRate(false);
refreshWeather();
window.setInterval(() => refreshRate(false), 5 * 60 * 1000);
